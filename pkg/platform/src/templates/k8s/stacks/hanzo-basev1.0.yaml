apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: {{iid}}-kms-sync
  namespace: {{namespace}}
spec:
  hostAPI: https://kms.hanzo.ai
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: base-kms-auth
        secretNamespace: {{namespace}}
      secretsScope:
        projectSlug: base
        envSlug: production
        secretsPath: /orgs/{{namespace}}/base/{{iid}}
  managedSecretReference:
    secretName: {{iid}}-base-secrets
    secretNamespace: {{namespace}}
    secretType: Opaque

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{iid}}
  namespace: {{namespace}}
spec:
  serviceName: {{iid}}
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  revisionHistoryLimit: 5
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: {{iid}}
  template:
    metadata:
      labels:
        app: {{iid}}
      annotations:
        secrets.lux.network/auto-reload: "true"
        secrets.lux.network/managed-secret: "{{iid}}-base-secrets"
    spec:
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: base
          image: {{registry.imageUrl}}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{networking.containerPort}}
              name: http
          env:
            - name: HZ_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{iid}}-base-secrets
                  key: ENCRYPTION_KEY
                  optional: true
            - name: HZ_SUPERUSER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{iid}}-base-secrets
                  key: SUPERUSER_EMAIL
            - name: HZ_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{iid}}-base-secrets
                  key: SUPERUSER_PASSWORD
            - name: HZ_DATA_DIR
              value: /app/data
            - name: IAM_URL
              value: http://iam.hanzo.svc.cluster.local
            - name: {{variables.0.name}}
              value: "{{variables.0.value}}"
            - name: {{variables.1.name}}
              value: "{{variables.1.value}}"
            - name: {{variables.2.name}}
              value: "{{variables.2.value}}"
            - name: {{variables.3.name}}
              value: "{{variables.3.value}}"
          envFrom:
            - secretRef:
                name: {{iid}}-base-secrets
                optional: true
          resources:
            requests:
              memory: {{podConfig.memoryRequest}}{{podConfig.memoryRequestType}}
              cpu: {{podConfig.cpuRequest}}{{podConfig.cpuRequestType}}
            limits:
              memory: {{podConfig.memoryLimit}}{{podConfig.memoryLimitType}}
              cpu: {{podConfig.cpuLimit}}{{podConfig.cpuLimitType}}
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /api/health
              port: {{networking.containerPort}}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{networking.containerPort}}
            failureThreshold: 5
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{networking.containerPort}}
            failureThreshold: 5
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{storageConfig.size}}{{storageConfig.sizeType}}

---

apiVersion: v1
kind: Service
metadata:
  name: {{iid}}-headless
  namespace: {{namespace}}
spec:
  ports:
    - port: 8090
      targetPort: {{networking.containerPort}}
      name: http
  clusterIP: None
  selector:
    app: {{iid}}
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: {{iid}}
  namespace: {{namespace}}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{networking.containerPort}}
      name: http
  selector:
    app: {{iid}}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{iid}}-netpol
  namespace: {{namespace}}
spec:
  podSelector:
    matchLabels:
      app: {{iid}}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{namespace}}
    ports:
    - port: 8090
      protocol: TCP
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - port: 53
      protocol: UDP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hanzo
    ports:
    - port: 443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hanzo
    ports:
    - port: 443
      protocol: TCP
  # KMS ZAP listener — kms-fetch init container + in-process ZAP clients
  # talk to  over TCP 9999 (binary protocol, X25519+ML-KEM-768
  # PQ handshake). Required for kms-fetch (task #29) and the broader
  # k8s-Secrets → KMS-ZAP migration (task #33). Without this rule, any
  # service whose Pod is gated by this NetworkPolicy cannot reach KMS
  # for secret fetch and panics on boot with "connection refused".
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hanzo
    ports:
    - port: 9999
      protocol: TCP
