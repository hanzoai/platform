services:
  platform-mcp-http:
    build: .
    container_name: platform-mcp-http
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - PLATFORM_URL=${PLATFORM_URL:-https://your-platform-server.com/api}
      - PLATFORM_AUTH_TOKEN=${PLATFORM_AUTH_TOKEN:-your_token_here}
    restart: unless-stopped
    networks:
      - mcp-network

  platform-mcp-stdio:
    build: .
    container_name: platform-mcp-stdio
    environment:
      - PLATFORM_URL=${PLATFORM_URL:-https://your-platform-server.com/api}
      - PLATFORM_AUTH_TOKEN=${PLATFORM_AUTH_TOKEN:-your_token_here}
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
