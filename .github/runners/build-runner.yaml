# Self-hosted GitHub Actions build runners on hanzo-k8s
# Purpose: CI builds, test suites, Docker builds
# Namespace: actions-runner-system
#
# Prerequisites:
#   Same github-runner-pat secret as the standard runners
#
# Deploy:
#   kubectl apply -f .github/runners/build-runner.yaml
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-build
  namespace: actions-runner-system
  labels:
    app: github-runner-build
spec:
  replicas: 2
  selector:
    matchLabels:
      app: github-runner-build
  template:
    metadata:
      labels:
        app: github-runner-build
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci-runner
          effect: NoSchedule
      nodeSelector:
        doks.digitalocean.com/node-pool: runner-pool
      containers:
        - name: runner
          image: myoung34/github-runner:ubuntu-jammy
          env:
            - name: RUNNER_SCOPE
              value: "org"
            - name: ORG_NAME
              value: "hanzoai"
            - name: LABELS
              value: "self-hosted,linux,x64,hanzo-build"
            - name: RUNNER_WORKDIR
              value: "/tmp/runner/work"
            - name: RUNNER_NAME_PREFIX
              value: "hanzo-build"
            - name: EPHEMERAL
              value: "true"
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-pat
                  key: ACCESS_TOKEN
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "12Gi"
          volumeMounts:
            - name: work
              mountPath: /tmp/runner/work
            - name: docker-sock
              mountPath: /var/run/docker.sock
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: work
          emptyDir: {}
        - name: docker-sock
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
