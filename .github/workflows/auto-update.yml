name: Auto Update Platform

on:
  repository_dispatch:
    types: [deploy-platform]
  workflow_dispatch:
  schedule:
    # Run every day at 3 AM UTC to check for updates
    - cron: '0 3 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger platform update
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            #!/bin/bash
            set -e

            # Navigate to platform directory
            cd /home/z/platform

            # Pull latest changes from git
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies if needed
            pnpm install --frozen-lockfile

            # Build the platform
            pnpm --filter=@hanzo/platform build
            pnpm --filter=@hanzo/paas build-server
            pnpm --filter=@hanzo/paas build-next

            # Restart the service
            # Using systemd service (if configured)
            sudo systemctl restart hanzo-platform || true

            # Or using Docker
            docker stop hanzo-platform || true
            docker rm hanzo-platform || true

            # Build new image locally
            docker build -t hanzoai/platform:local .

            # Run with new image
            docker run -d \
              --name hanzo-platform \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e DATABASE_URL="postgresql://hanzo:hanzo123@hanzo-postgres:5432/hanzo" \
              -e REDIS_URL="redis://hanzo-redis:6379" \
              -e AUTH_SECRET="hanzo_auth_secret_key_production_2025" \
              -e NEXTAUTH_URL="https://platform.hanzo.ai" \
              -e SERVER_URL="https://platform.hanzo.ai" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v hanzo-postgres-database:/var/lib/postgresql/data \
              -v hanzo-data:/app \
              --network hanzo-network \
              hanzoai/platform:local

            echo "Platform updated successfully!"