name: Generate and Sync OpenAPI

on:
  push:
    branches:
      - canary
      - main
    paths:
      - 'app/platform/server/api/routers/**'
      - 'packages/server/src/services/**'
      - 'packages/server/src/db/schema/**'
      - 'pkg/platform/src/services/**'
      - 'pkg/platform/src/db/schema/**'

  workflow_dispatch:

jobs:
  generate-and-commit:
    name: Generate OpenAPI and sync to docs
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout Platform repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: "pnpm"

      - name: Ensure native build toolchain (node-gyp needs make/gcc/python)
        run: |
          command -v make >/dev/null && command -v cc >/dev/null && exit 0
          (sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3) \
            || (apt-get update -qq && apt-get install -y -qq build-essential python3) \
            || (apk add --no-cache build-base python3) || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI specification
        run: |
          pnpm generate:openapi

          # Verifica que se generó correctamente
          if [ ! -f openapi.json ]; then
            echo "❌ openapi.json not found"
            exit 1
          fi

          echo "✅ OpenAPI specification generated successfully"

      - name: Sync to website repository
        run: |
          # Clona el repositorio de website
          git clone https://x-access-token:${{ secrets.DOCS_SYNC_TOKEN }}@github.com/hanzoai/website.git website-repo

          cd website-repo

          # Copia el openapi.json al website (sobrescribe)
          mkdir -p apps/docs/public
          cp -f ../openapi.json apps/docs/public/openapi.json

          # Configura git
          git config user.name "Hanzo Bot"
          git config user.email "bot@hanzo.ai"

          # Agrega y commitea siempre
          git add apps/docs/public/openapi.json
          git commit -m "chore: sync OpenAPI specification [skip ci]" \
            -m "Source: ${{ github.repository }}@${{ github.sha }}" \
            -m "Updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            --allow-empty

          git push

          echo "✅ OpenAPI synced to website successfully"
