name: Docker (base)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile.base']
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday rebuild
permissions:
  contents: read
  packages: write
jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/platform-base
      dockerfile: Dockerfile.base
    secrets: inherit
