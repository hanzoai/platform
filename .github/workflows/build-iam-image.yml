name: Build IAM Image

# Self-hosted-only build of the platform image for the IAM SDK 0.11.0 change.
# Bypasses the GitHub-hosted `quality` gate (org billing freeze) by running
# entirely on the canonical hanzoai amd64 pool. Pushes an IMMUTABLE sha- tag
# (never :latest). Rollout onto deployment/paas is a separate kubectl step.
on:
  push:
    branches: [feat/iam-sdk-0.11.0]
    paths: ['.github/workflows/build-iam-image.yml']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: hanzoai

jobs:
  build:
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha7=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/platform:sha-${{ steps.meta.outputs.sha7 }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform:buildcache,mode=max
