name: Pull Request

on:
  pull_request:
    branches: [main, canary]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@hanzo/platform build
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@hanzo/platform build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@hanzo/platform build
      - run: pnpm build
