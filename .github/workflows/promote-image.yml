# Image Promoter — GitOps bridge between CI and CD
#
# After the build workflow pushes a new Docker image, this workflow
# updates the image tag in the universe repo. ArgoCD then detects
# the commit and rolls out the new version.
#
# Flow: platform repo CI green -> promote-image -> universe repo commit -> ArgoCD sync
#
# This runs as a separate workflow (not a job in deploy.yml) so it can
# be triggered independently for rollbacks or manual promotions.
name: Promote Image

on:
  # Trigger after the build workflow completes successfully
  workflow_run:
    workflows: ["Build & Deploy Platform"]
    types: [completed]
    branches: [main]

  # Manual trigger for rollbacks or re-promotions
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote (e.g., v0.28.2 or a SHA)"
        required: true
        type: string
      service:
        description: "Service to promote"
        required: true
        default: paas
        type: choice
        options:
          - paas

env:
  UNIVERSE_REPO: hanzoai/universe
  UNIVERSE_BRANCH: main
  KUSTOMIZE_PATH: infra/k8s/paas
  IMAGE_NAME: ghcr.io/hanzoai/platform

jobs:
  promote:
    # Only run if the triggering workflow succeeded (or manual dispatch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "Promoting manually specified tag: ${{ inputs.image_tag }}"
          else
            # For workflow_run triggers, read the version from the triggering run
            # The build workflow tags images as: latest, v<version>, amd64-<sha>, arm64-<sha>
            # We want the version tag for the universe manifest
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "sha=${SHA}" >> $GITHUB_OUTPUT

            # Fetch version from package.json at that SHA
            VERSION=$(curl -sL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/app/platform/package.json?ref=${SHA}" \
              | jq -r .version)

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "Failed to determine version from package.json at SHA ${SHA}"
              exit 1
            fi

            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "Promoting version: v${VERSION} (from SHA: ${SHA})"
          fi

      - name: Verify image exists in GHCR
        run: |
          NEW_TAG="${{ steps.tag.outputs.tag }}"
          echo "Checking that ${{ env.IMAGE_NAME }}:${NEW_TAG} exists in GHCR..."

          # Use the GitHub packages API to verify the image tag exists
          # The manifest endpoint returns 200 if the tag exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/hanzoai/platform/manifests/${NEW_TAG}")

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Image ${{ env.IMAGE_NAME }}:${NEW_TAG} not found (HTTP ${STATUS})"
            echo "The build may still be pushing. Wait and retry."
            exit 1
          fi
          echo "Image verified: ${{ env.IMAGE_NAME }}:${NEW_TAG}"

      - name: Checkout universe repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UNIVERSE_REPO }}
          ref: ${{ env.UNIVERSE_BRANCH }}
          token: ${{ secrets.UNIVERSE_DEPLOY_TOKEN }}
          path: universe

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag in kustomization.yaml
        working-directory: universe/${{ env.KUSTOMIZE_PATH }}
        run: |
          NEW_TAG="${{ steps.tag.outputs.tag }}"
          echo "Setting image tag to: ${NEW_TAG}"

          # Use kustomize to update the image tag
          kustomize edit set image "${{ env.IMAGE_NAME }}:${NEW_TAG}"

          echo "Updated kustomization.yaml:"
          cat kustomization.yaml

          # Verify the change
          if ! grep -q "newTag: ${NEW_TAG}" kustomization.yaml; then
            echo "ERROR: Tag was not updated in kustomization.yaml"
            exit 1
          fi

      - name: Commit and push
        working-directory: universe
        run: |
          NEW_TAG="${{ steps.tag.outputs.tag }}"
          SHA="${{ steps.tag.outputs.sha }}"

          git config user.name "hanzo-ci[bot]"
          git config user.email "ci@hanzo.ai"

          git add "${{ env.KUSTOMIZE_PATH }}/kustomization.yaml"

          # Check if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — image tag already at ${NEW_TAG}"
            exit 0
          fi

          # Commit with metadata for traceability
          COMMIT_MSG="chore(paas): promote image to ${NEW_TAG}"
          if [ -n "$SHA" ]; then
            COMMIT_MSG="${COMMIT_MSG}

Source: ${{ github.repository }}@${SHA}
Build: ${{ github.event.workflow_run.html_url }}"
          fi

          git commit -m "${COMMIT_MSG}"
          git push origin ${{ env.UNIVERSE_BRANCH }}

          echo "Pushed image promotion to universe repo"
          echo "ArgoCD will sync within ~30 seconds (webhook) or ~3 minutes (poll)"

      # Optional: trigger an explicit ArgoCD sync instead of waiting
      # Requires ARGOCD_AUTH_TOKEN secret and argocd CLI
      # - name: Trigger ArgoCD sync
      #   run: |
      #     argocd app sync hanzo-paas \
      #       --server argocd.hanzo.ai \
      #       --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} \
      #       --async
