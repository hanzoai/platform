# Deployment managed by hanzoai/universe — this workflow only builds and pushes images
name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, canary, dev, test]
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  quality:
    # node-pty + cpu-features compile from source via node-gyp; the
    # hanzo-build-linux-amd64 ARC runner ships only the docker tooling
    # needed for buildx and lacks make/gcc. ubuntu-latest carries the
    # full GitHub-hosted toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:build
      - run: pnpm build

  docker:
    needs: quality
    strategy:
      matrix:
        include:
          - image: ghcr.io/hanzoai/platform
            dockerfile: Dockerfile
          - image: ghcr.io/hanzoai/platform-cloud
            dockerfile: Dockerfile.cloud
          - image: ghcr.io/hanzoai/platform-schedule
            dockerfile: Dockerfile.schedule
          - image: ghcr.io/hanzoai/platform-server
            dockerfile: Dockerfile.server
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
    secrets: inherit

  notify-universe:
    needs: [docker]
    runs-on: hanzo-deploy-linux-amd64
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Dispatch image update to universe
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_DISPATCH_TOKEN }}
          repository: hanzoai/universe
          event-type: image-update
          client-payload: |
            {
              "service": "platform",
              "image": "ghcr.io/hanzoai/platform:${{ github.sha }}",
              "sha": "${{ github.sha }}",
              "repo": "${{ github.repository }}"
            }
