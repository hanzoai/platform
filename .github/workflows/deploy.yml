name: Build & Deploy Platform

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: hanzoai

jobs:
  # ── Build platform ─────────────────────────────────────────────────
  platform:
    runs-on: hanzo-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "suffix=latest" >> $GITHUB_OUTPUT
          else
            echo "suffix=canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform:${{ steps.meta.outputs.suffix }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform:buildcache,mode=max

  # ── Build platform-cloud ───────────────────────────────────────────
  platform-cloud:
    runs-on: hanzo-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "suffix=latest" >> $GITHUB_OUTPUT
          else
            echo "suffix=canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cloud
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:${{ steps.meta.outputs.suffix }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:buildcache,mode=max

  # ── Build schedule + server ────────────────────────────────────────
  schedule:
    runs-on: hanzo-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:latest,${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.schedule
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:buildcache,mode=max

  server:
    runs-on: hanzo-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:latest,${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:buildcache,mode=max
