name: Build & Deploy Platform

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: hanzoai

jobs:
  # ── Test gates — broken code does not ship ───────────────────
  quality:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        check: [build, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: 'pnpm'

      - name: Install Nixpacks
        if: matrix.check == 'test'
        run: |
          export NIXPACKS_VERSION=1.41.0
          curl -sSL https://nixpacks.com/install.sh | bash

      - name: Install Railpack
        if: matrix.check == 'test'
        run: |
          export RAILPACK_VERSION=0.15.4
          curl -sSL https://railpack.com/install.sh | bash

      - name: Add build tools to PATH
        if: matrix.check == 'test'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize Docker Swarm
        if: matrix.check == 'test'
        run: |
          docker swarm init
          docker network create --driver overlay platform-network || true

      - name: Ensure native build toolchain (node-gyp needs make/gcc/python)
        run: |
          command -v make >/dev/null && command -v cc >/dev/null && exit 0
          (sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3) \
            || (apt-get update -qq && apt-get install -y -qq build-essential python3) \
            || (apk add --no-cache build-base python3) || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:build
      - run: pnpm ${{ matrix.check }}

  # ── Build platform ──────────────────────────────────────────
  platform:
    needs: [quality]
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: .github/buildkitd.toml
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "suffix=latest" >> $GITHUB_OUTPUT
          else
            echo "suffix=canary" >> $GITHUB_OUTPUT
          fi
      # A published version tag is immutable. Re-pushing it leaves two digests
      # behind one name, and every cluster pinned to it with
      # imagePullPolicy: IfNotPresent keeps running whichever it cached first —
      # a green pipeline over unchanged production. That happened to v4.4.5 on
      # 2026-07-25 (sha256:178d1762 built, sha256:b33f2de5 still serving). Bump
      # app/platform/package.json instead of overwriting.
      - name: Refuse to overwrite a published version tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Fail-open: only block on a definitive hit, never on an API hiccup.
          if gh api --paginate "/orgs/${{ env.ORG }}/packages/container/platform/versions" \
               --jq '.[].metadata.container.tags[]?' 2>/dev/null | grep -qx "$VERSION"; then
            echo "::error::ghcr.io/${{ env.ORG }}/platform:$VERSION is already published. Patch-bump app/platform/package.json (x.y.z+1) and pin the deployment to the new tag in the same commit."
            exit 1
          fi
          echo "$VERSION is unpublished — safe to push."
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: platform
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform:${{ steps.meta.outputs.suffix }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform:buildcache,mode=max

  # ── Build platform-cloud ───────────────────────────────────
  platform-cloud:
    needs: [quality]
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: .github/buildkitd.toml
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "suffix=latest" >> $GITHUB_OUTPUT
          else
            echo "suffix=canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: cloud
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:${{ steps.meta.outputs.suffix }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-cloud:buildcache,mode=max

  # ── Build schedule + server ────────────────────────────────
  schedule:
    needs: [quality]
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: .github/buildkitd.toml
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:latest,${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: schedules
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-schedule:buildcache,mode=max

  server:
    needs: [quality]
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: .github/buildkitd.toml
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:latest,${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:canary" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/platform-server:buildcache,mode=max
