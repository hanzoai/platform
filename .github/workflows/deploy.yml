# Deployment managed by hanzoai/universe — this workflow only builds and pushes images
name: Build Platform

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: hanzoai

jobs:
  # ── Build gate — broken code does not ship ───────────────────
  # Integration tests (Redis, Docker Swarm) are NOT run here.
  # Production deployment is gated by universe repo E2E tests.
  # See: github.com/hanzoai/universe/.github/workflows/deploy-production.yml
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm server:build
      - run: pnpm build

  # ── Docker image builds ─────────────────────────────────────
  # Uses a matrix strategy with max-parallel: 2 to avoid exhausting
  # self-hosted runner resources (4 concurrent buildx builds cause
  # Docker daemon OOM / graceful_stop EOF errors).
  images:
    needs: [quality]
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: platform
            file: ./Dockerfile
            tag-style: suffix   # produces :latest/:canary + :version + :sha
          - image: platform-cloud
            file: ./Dockerfile.cloud
            tag-style: suffix
          - image: platform-schedule
            file: ./Dockerfile.schedule
            tag-style: csv
          - image: platform-server
            file: ./Dockerfile.server
            tag-style: csv
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          VERSION=$(jq -r .version app/platform/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SUFFIX=latest
          else
            SUFFIX=canary
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

          if [ "${{ matrix.tag-style }}" = "suffix" ]; then
            TAGS="${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${SUFFIX}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${VERSION}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${{ github.sha }}"
          else
            TAGS="${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${SUFFIX}"
            if [ "$SUFFIX" = "latest" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${VERSION}"
            fi
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:buildcache,mode=max

  # ── Notify universe of new images ──────────────────────────
  notify-universe:
    needs: [images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify universe of new images
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_DISPATCH_TOKEN }}
          repository: hanzoai/universe
          event-type: image-updated
          client-payload: '{"service":"platform","version":"${{ needs.images.outputs.version }}","sha":"${{ github.sha }}"}'
