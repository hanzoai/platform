# platform — the ONE build, on Hanzo's own Hanzo Git.
#
#   git.hanzo.ai push → act_runner (in-cluster git-runner, privileged dind)
#   → docker build → ghcr.io/hanzoai/platform:<sha> → operator/StatefulSet
#
# GitHub Actions is disabled account-wide, so `.github/workflows/*` cannot
# build. This is the real pipeline. No GitHub builders.
#
# A push to main is tagged by COMMIT SHA. A semver tag that gets RE-PUSHED means
# two digests behind one name, and with imagePullPolicy: IfNotPresent the node
# keeps whichever it cached first — that is how v4.4.5 and v4.4.6 each came to
# mean two different builds on 2026-07-25. A SHA cannot move.
#
# A `v*` TAG also builds, and publishes under that version. That is not a walk-
# back of the sentence above: what caused the incident was OVERWRITING a version
# that already existed, so this refuses to. The tag is resolved against the
# registry BEFORE the build, and an existing one fails the run rather than
# replacing it — so a version still cannot move, and now it also exists.
#
# It has to exist, because a sha is not a release. universe pins `tag:` AND
# `digest:` together and its pin gate refuses a tag that is not [v]X.Y.Z: with
# sha-only publishing, platform could be rolled forward only by writing a pin
# the fleet's own gate rejects. Publishing the version and pinning the digest
# makes the pin both immutable and legible, which is what the gate is for.
#
# TWO ARCHITECTURES, JOINED AT THE REGISTRY. The lab runs amd64 and arm64, so a
# name that resolves to only one of them deploys on half the fleet, and which
# half is decided by whichever pool happened to build it. Each architecture is
# built on its own native pool under a `<name>-<arch>` tag; the merge job joins
# the two into the manifest list the fleet pins, and is the only job that writes
# the release name. Splitting the build is not a preference: the stage check
# below reads the image out of the local daemon, and a manifest list cannot be
# loaded into one.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      # Not fail-fast: a failed arm64 leg must not cancel a healthy amd64 one
      # mid-push. Either way merge never runs, so no release name is written
      # from half a build.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            pool: hanzo-build-linux-amd64
          - arch: arm64
            pool: hanzo-build-linux-arm64
    runs-on: ['${{ matrix.pool }}']
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      # The publishable ingest key, from KMS — the only store secrets come from.
      # Same surface and same key name every other Hanzo web build reads, so the
      # value has ONE name and ONE home no matter which pipeline builds it.
      #
      # ABSENCE IS FATAL, and it says which call failed. An unkeyed bundle is not
      # a degraded build: api.hanzo.ai refuses a logged-out beacon that carries no
      # resolvable key (401 ingest_key_required) while the page looks perfectly
      # healthy, so the failure is invisible until someone reads the warehouse and
      # finds platform.hanzo.ai missing. A missing image is loud; a keyless one is
      # not, so the missing image is the better failure.
      #
      # Each curl is rescued (`|| true`) so the CHECK decides rather than bash -e
      # aborting the step before any guard can print — an aborted step reports a
      # bare exit code and names neither call.
      - name: Fetch the ingest key from KMS
        id: ingest
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
        run: |
          set -uo pipefail
          if [ -z "${KMS_CLIENT_ID:-}" ] || [ -z "${KMS_CLIENT_SECRET:-}" ]; then
            echo "::error::KMS credentials absent (KMS_CLIENT_ID/KMS_CLIENT_SECRET) — refusing to ship a bundle with no ingest key"
            exit 1
          fi
          TOKEN=$(curl -sS -m 30 "$KMS_ENDPOINT/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" \
            2>/dev/null | jq -r '.accessToken // empty' || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::KMS login failed at $KMS_ENDPOINT/v1/kms/auth/login — refusing to ship a bundle with no ingest key"; exit 1
          fi
          # Embedded KMS (HIP-0106): org from the token, flat {"value"}.
          V=$(curl -sS -m 30 "$KMS_ENDPOINT/v1/kms/secrets/deploy/PUBLISHABLE_KEY?env=prod" \
            -H "Authorization: Bearer $TOKEN" 2>/dev/null | jq -r '.value // empty' || true)
          if [ -z "$V" ]; then
            echo "::error::PUBLISHABLE_KEY absent from KMS (path deploy, env prod) — refusing to ship a bundle with no ingest key"; exit 1
          fi
          echo "::add-mask::$V"
          echo "key=$V" >> "$GITHUB_OUTPUT"
          echo "ingest key resolved (${#V} chars)"

      - name: Build + push
        env:
          # Through the environment, not the command line: an inline --build-arg
          # written into the `run:` script would put the key in the job log.
          PUBLISHABLE_KEY: ${{ steps.ingest.outputs.key }}
        run: |
          set -euo pipefail
          # A tag push publishes the VERSION; a branch push publishes the sha.
          # One build either way — the ref is the only thing that differs.
          REF="${GITHUB_SHA}"
          case "${GITHUB_REF:-}" in
            refs/tags/*)
              REF="${GITHUB_REF#refs/tags/}"
              # THE VERSION MUST NOT ALREADY EXIST. Overwriting one is the
              # v4.4.5/v4.4.6 incident, and it is silent: the registry accepts
              # the push, and every node that cached the old digest keeps
              # serving it under the new name. Asked before the build so the
              # refusal costs seconds, not a full image.
              TOKEN=$(curl -sS -u "${{ secrets.GHCR_USER }}:${{ secrets.GHCR_TOKEN }}" \
                "https://ghcr.io/token?scope=repository:hanzoai/platform:pull&service=ghcr.io" \
                | jq -r '.token // empty')
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/hanzoai/platform/manifests/${REF}")
              if [ "$CODE" = "200" ]; then
                echo "::error::ghcr.io/hanzoai/platform:${REF} already exists — a published version is immutable. Cut the next patch instead."
                exit 1
              fi
              echo "version ${REF} is unpublished (registry answered ${CODE}) — building it"
              ;;
          esac
          # A per-arch name, never the release name — that one is a manifest
          # list and only the merge job writes it. A version that resolves to
          # one architecture is worse than a version that does not exist yet,
          # because it pulls successfully on that arch and fails everywhere else.
          IMAGE="ghcr.io/hanzoai/platform:${REF}-${{ matrix.arch }}"
          # Build-time by necessity: Next inlines NEXT_PUBLIC_* into the client
          # bundle, so a key set on the pod arrives too late to reach a browser.
          # The Dockerfile's build-platform stage gates on this and fails closed.
          docker build --target platform -f Dockerfile \
            --build-arg PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            -t "$IMAGE" .

          # THE STAGE IS CHECKED BEFORE THE IMAGE LEAVES THE RUNNER.
          #
          # `api` is the LAST stage in the Dockerfile, so a build that loses its
          # `--target` produces that instead — and every runtime stage starts the
          # same server, so the mistake is invisible in the registry, survives a
          # rollout, and only surfaces when a pod is REPLACED. v4.4.13 is that
          # image: the api stage under the platform name, which crashlooped
          # platform.hanzo.ai and the build door the moment its pod restarted.
          # An unpublished failure here costs a red run; a published one costs
          # the control plane.
          STAGE=$(docker inspect --format '{{ index .Config.Labels "hanzo.stage" }}' "$IMAGE")
          if [ "$STAGE" != "platform" ]; then
            echo "::error::built the '${STAGE:-<unlabelled>}' stage, not 'platform' — refusing to push it under the platform name"
            exit 1
          fi
          echo "stage verified: $STAGE"

          docker push "$IMAGE"
          echo "built $IMAGE"

  merge:
    needs: build
    # Registry-side only: imagetools reads the two per-arch manifests and writes
    # a list that points at both. No build and no platform of its own, so which
    # pool runs this does not matter.
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      - name: Join both architectures under the release name
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/*) REF="${GITHUB_REF#refs/tags/}" ;;
            *)           REF="${GITHUB_SHA}" ;;
          esac
          IMAGE="ghcr.io/hanzoai/platform:${REF}"
          docker buildx imagetools create -t "$IMAGE" "${IMAGE}-amd64" "${IMAGE}-arm64"

          # A manifest list with one entry pulls fine on the arch that built it
          # and fails everywhere else, which is exactly the state this replaces.
          # Counting the platforms is what makes "both" a fact rather than an
          # intention.
          got=$(docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "$IMAGE -> ${got}"
          for want in linux/amd64 linux/arm64; do
            case " $got " in
              *" $want "*) ;;
              *) echo "::error::$IMAGE does not carry $want"; exit 1 ;;
            esac
          done

      # ⚠️ THIS STEP TELLS THE CLUSTER NOTHING. It writes image.txt onto an
      # ephemeral runner filesystem that is discarded when the job ends, and it
      # is continue-on-error, so it cannot even fail loudly. The comment that
      # used to sit here claimed "the cluster is told the exact SHA that was
      # just built ... declared state and the artifact can never disagree" —
      # that guarantee does not exist. Publishing and rolling are separate, and
      # only publishing is automated.
      #
      # It also named the wrong file. k8s/platform-statefulset.yaml is real but
      # the cluster does not read it: the CD Application hanzo-cd/
      # hanzo-platform-app reads git.hanzo.ai/hanzo/universe, path charts/app,
      # values/hanzo/platform-app.yaml — and that file pins `tag:` AND
      # `digest:`, which MOVE TOGETHER. Bumping the tag alone renders
      # newtag@olddigest: the pod reports the new SHA while serving the old
      # bytes.
      #
      # Keep this step honest rather than deleting it — the printed image ref
      # is what a human needs to make that edit.
      - name: Print the image ref for the rollout edit
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/*) echo "ghcr.io/hanzoai/platform:${GITHUB_REF#refs/tags/}" ;;
            *)           echo "ghcr.io/hanzoai/platform:${GITHUB_SHA}" ;;
          esac
          echo "To roll it out, set tag AND digest together in"
          echo "  hanzo/universe charts/app/values/hanzo/platform-app.yaml"
        continue-on-error: true
