name: Sync from GitHub
# git.hanzo.ai is the build plane; development also lands on
# github.com/hanzoai/platform. Without this job nothing pulls one to the other,
# and Hanzo Git quietly serves older source than anyone is reading.
#
# That is not hypothetical. On 2026-08-08 Hanzo Git sat three commits behind for
# hours, so `8ea8386` ("carry an image's args: into the build") was never
# compiled by anything — it carried four type errors and looked fine, because the
# only thing that would have caught them never saw it. The gap surfaced the
# moment Hanzo Git was fast-forwarded by hand. Every sibling repo (chat, app, id)
# already had this workflow; platform was the one without it.
#
# ONE deterministic direction: an in-cluster PULL. The runner reaches both ends —
# GitHub outbound and this git via the instance URL actions/checkout already
# uses — so there is no ingress dependency. Fast-forward ONLY: a real divergence
# fails loudly here instead of force-pushing either side and losing somebody's
# commits.
#
# WHO WRITES GIT.HANZO.AI. GIT_TOKEN, not the runner's own workflow token. main
# has been protected since 2026-08-09, and a protected branch admits a pusher
# with WRITE on the code — which the workflow token does not have here: a
# scheduled run is attributed to the actions user, who is nobody's collaborator.
# Every push has been declined by the pre-receive hook since 2026-08-11T17:50,
# the first run after the rule that actually had commits to carry. It read as a
# sync failure and was a permission one; the fetch from GitHub was fine
# throughout, and the histories never diverged.
#
# The runs in between went GREEN while broken, because this job only pushes when
# GitHub is ahead — two days of "in sync" said nothing about whether it could
# write. So the pin is a real credential (the same contents:write secret the
# fleet's cut lane pushes with), and nothing is persisted from the checkout:
# one credential on the wire, not two.
#
# A push made by a real identity also fires the push event, so cicd builds the
# synced commits by itself. The explicit dispatch that used to stand in for that
# is gone — with a workflow-token push it was the only thing that built; with
# this one it is a second identical build.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency:
  group: sync-from-github
  cancel-in-progress: false
jobs:
  ff-main:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - name: Checkout main (full history for the ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The write below carries its own credential; a persisted one would
          # only be the token the branch rule refuses.
          persist-credentials: false
      - name: Fast-forward main from github.com/hanzoai/platform
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet "https://x-access-token:${GH_PAT}@github.com/hanzoai/platform.git" main
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse FETCH_HEAD)"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "in sync at $LOCAL"
            exit 0
          fi
          if git merge-base --is-ancestor "$LOCAL" "$REMOTE"; then
            echo "fast-forwarding $LOCAL -> $REMOTE"
            [ -n "${GIT_TOKEN:-}" ] || {
              echo "::error::Hanzo Git write needs GIT_TOKEN (contents:write) — refusing to sync silently."
              exit 1
            }
            git -c http.extraheader="Authorization: token ${GIT_TOKEN}" \
              push "${{ github.server_url }}/${{ github.repository }}.git" \
              "$REMOTE:refs/heads/main"
          elif git merge-base --is-ancestor "$REMOTE" "$LOCAL"; then
            echo "this git is AHEAD of GitHub ($REMOTE ancestor of $LOCAL) — nothing to pull."
            echo "(GitHub catch-up is a separate concern; never force from here.)"
          else
            echo "::error::main DIVERGED between GitHub ($REMOTE) and this git ($LOCAL) — refusing to force. Reconcile manually."
            exit 1
          fi
