# platform-app is a control plane: it builds its dashboard by INVENTORYING the
# cluster — listing the Hanzo operator CRs (apps, services, functions, …) plus
# the core workloads behind them — to show what is deployed and whether it is
# healthy. That needs a read identity.
#
# Without this it runs as the namespace `default` ServiceAccount, which has no
# permissions, and the apps-inventory scheduler loops on:
#   services.hanzo.ai is forbidden: User "system:serviceaccount:hanzo:default"
#   cannot list resource "services" in API group "hanzo.ai"
#
# The grant is READ-ONLY and cluster-wide on purpose: the platform observes the
# whole estate across namespaces, and never mutates through this identity. The
# deploy/apply path (writing App CRs) is a separate, explicitly-scoped concern —
# it is NOT granted here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-app
  namespace: hanzo
  labels:
    app: platform-app
    app.kubernetes.io/name: platform-app
    app.kubernetes.io/part-of: hanzo-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-app-reader
  labels:
    app.kubernetes.io/part-of: hanzo-platform
rules:
  # Hanzo operator CRs — the App/Service inventory the dashboard renders. The
  # base `hanzo.ai` group holds apps + services + the datastore/function/gateway
  # family; the sub-groups carry the nchain, gateway and KMS kinds.
  #
  # `apps.hanzo.ai` also carries CD's own `Application`/`AppProject` kinds, and
  # THAT is how the board sees lux and zoo at all: CD reconciles those clusters
  # and records what it found (images, sync, health) on objects that live right
  # here. Platform reads them and holds no other cluster's credentials — note it
  # is deliberately NOT granted `secrets`, where those credentials are.
  - apiGroups:
      - hanzo.ai
      - apps.hanzo.ai
      - nchain.hanzo.ai
      - gateway.hanzo.ai
      - kms.hanzo.ai
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Core + workload status, for the health rollup behind each app tile.
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-app-reader
  labels:
    app.kubernetes.io/part-of: hanzo-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-app-reader
subjects:
  - kind: ServiceAccount
    name: platform-app
    namespace: hanzo
---
# The smoke. `services/ci/smoke-runner` starts the exact built image in one
# throwaway pod and promotes only if it reaches readiness — so it needs to create
# a pod, watch it, and delete it. NAMESPACED and per-namespace on purpose: this is
# the one write grant platform holds, and it is the narrowest verb set that can
# express "run these bytes once".
#
# Scope honestly: pod-create in a namespace is the right to mount any Secret in
# that namespace, which is why this is a Role bound in `hanzo` rather than a line
# added to the cluster-wide reader above. Two things bound it, and both are in the
# code rather than in RBAC, which cannot see inside a pod spec:
#
#   the SPEC is derived from the LIVE Deployment, never from repo input — so the
#   secret set is exactly what the app already mounts, and a connected repo has no
#   way to name a different one;
#   the NAMESPACE is checked by `authorizeNamespace` before anything is created,
#   so an org can only smoke into a namespace it already owns.
#
# A namespace that has not applied this Role cannot be smoked into, and a smoke
# that cannot run does not promote. That is the intended failure: no privilege,
# no deploy — never no privilege, deploy anyway.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-app-smoke
  namespace: hanzo
  labels:
    app.kubernetes.io/part-of: hanzo-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-app-smoke
  namespace: hanzo
  labels:
    app.kubernetes.io/part-of: hanzo-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-app-smoke
subjects:
  - kind: ServiceAccount
    name: platform-app
    namespace: hanzo
