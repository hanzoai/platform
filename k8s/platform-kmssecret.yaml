# KMS → K8s Secret sync for the platform-app StatefulSet.
#
# Provisions `platform-app-secrets` from KMS (kms.hanzo.ai) with ONLY the keys
# the TypeScript platform app needs — least privilege, no plaintext in git.
# The KMSSecret operator pulls from KMS on a 60s resync and writes the K8s
# Secret the StatefulSet mounts. Rotating a value in KMS propagates here without
# touching this manifest.
#
# PAAS_DO_API_TOKEN backs dedicated-cluster provisioning (DigitalOcean API);
# OPERATOR_PAAS_SHARED_SECRET is the PaaS-ticket HS256 key that platform signs
# with and seeds into each dedicated cluster's operator. Both are read in-process
# only via services/kms.ts (requireKmsSecret) — never hardcoded.
#
# `creationPolicy: Orphan` keeps the synced Secret if this KMSSecret is deleted,
# matching the data-preservation posture of the Retain PVC: never let teardown
# silently drop credentials.
apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: platform-app-kms-sync
  namespace: hanzo
  labels:
    app.kubernetes.io/component: kms-secret
    app.kubernetes.io/name: platform-app
    app.kubernetes.io/part-of: hanzo-platform
    kms.hanzo.ai/env: prod
    kms.hanzo.ai/org: hanzo
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: hanzo-platform-iam-creds
        secretNamespace: hanzo
      secretsScope:
        envSlug: prod
        projectSlug: hanzo
        secretsPath: /platform-app-secrets
        # A key listed here is OWNED by this sync: on every resync the operator
        # writes what KMS returns and REMOVES a declared key KMS does not have.
        # NEXTAUTH_SECRET was declared but absent from KMS, so each 60s resync
        # deleted it from platform-app-secrets — invisible while a pod ran (env is
        # read once at container start) and then a hard
        # `CreateContainerConfigError: couldn't find key NEXTAUTH_SECRET` on the
        # next roll, twice on 2026-07-25. Only declare a key once KMS actually
        # holds it; until then it stays hand-set alongside DATABASE_URL,
        # GITHUB_APP_* and MINIO_*, which are likewise not synced.
        keys:
          - IAM_CLIENT_ID
          - IAM_CLIENT_SECRET
          - PAAS_DO_API_TOKEN
          - OPERATOR_PAAS_SHARED_SECRET
  hostAPI: http://kms.hanzo.svc
  managedSecretReference:
    creationPolicy: Orphan
    secretName: platform-app-secrets
    secretNamespace: hanzo
    secretType: Opaque
  resyncInterval: 60
