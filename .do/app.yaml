# DigitalOcean App Platform — EPHEMERAL PREVIEW ONLY.
#
# App Platform's service filesystem is ephemeral: it is wiped on every restart,
# redeploy, and horizontal scale event. Platform's datastore is now Base SQLite
# (a file on disk), so a persistent App-Platform deployment would silently lose
# all data on the next restart. App Platform has no disk/volume primitive that
# gives a single SQLite file a stable home across restarts.
#
# Therefore this spec is for throwaway preview environments only, and it pins
# the database to in-memory SQLite (`PLATFORM_DB_PATH=:memory:`) so the
# ephemerality is explicit and intentional — not an accident waiting to corrupt
# real data. Each preview boots a fresh empty DB and discards it on teardown.
#
# The persistent production deployment is a Kubernetes StatefulSet backed by a
# PersistentVolumeClaim (`/app/data` → 50Gi PVC). It owns the primary domain
# platform.hanzo.ai. See `k8s/platform-statefulset.yaml`.
name: hanzo-platform-preview
region: nyc
services:
  - name: platform
    source_dir: /
    github:
      repo: hanzoai/platform
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.cloud
    instance_count: 1
    instance_size_slug: professional-xs
    http_port: 3000
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: "production"
      # In-memory SQLite: previews are ephemeral by design. No file, no PVC,
      # nothing to lose on restart. NEVER point this at a file path on App
      # Platform — that filesystem does not survive a restart, and
      # resolveSqlitePath would happily open (then lose) the file.
      - key: PLATFORM_DB_PATH
        value: ":memory:"
      - key: NEXTAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NEXTAUTH_URL
        value: "https://platform.hanzo.ai"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://platform.hanzo.ai"
      - key: IAM_ENDPOINT
        value: "https://hanzo.id"
      - key: IAM_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: IAM_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
