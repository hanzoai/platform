# Hanzo Platform - Local Development Docker Compose
# This sets up a complete local instance of Hanzo Platform for testing

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-platform-postgres
    environment:
      POSTGRES_USER: hanzo
      POSTGRES_PASSWORD: hanzo-local-dev-123
      POSTGRES_DB: hanzo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hanzo-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hanzo Platform
  platform:
    build:
      context: .
      dockerfile: docker/hanzo/Dockerfile
      args:
        BUILDPLATFORM: linux/amd64
    container_name: hanzo-platform
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://hanzo:hanzo-local-dev-123@postgres:5432/hanzo
      REDIS_URL: redis://redis:6379
      
      # Auth
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: your-nextauth-secret-here-change-in-production
      
      # GitHub OAuth (optional - for login)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      
      # Platform settings
      NODE_ENV: development
      PLATFORM_URL: http://localhost:3000
      
      # Admin user (created on first run)
      ADMIN_EMAIL: admin@hanzo.local
      ADMIN_PASSWORD: admin123
      
      # Features
      DISABLE_SIGNUP: "false"
      ENABLE_MCP: "true"
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount for development (optional)
      # - ./app/hanzo:/app/app/hanzo:ro
      # - ./pkg/core:/app/pkg/core:ro
      
      # Docker socket for deployments
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Data persistence
      - platform_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Traefik (for local routing like production)
  traefik:
    image: traefik:v3.0
    container_name: hanzo-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"

volumes:
  postgres_data:
  redis_data:
  platform_data: