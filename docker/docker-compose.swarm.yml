version: '3.8'

services:
  hanzo-platform:
    image: hanzoai/platform:v1.0.0
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/platform
      - REDIS_URL=redis://host.docker.internal:6379
      - IS_CLOUD=false
      - PORT=3000
    networks:
      - hanzo-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  hanzo-network:
    driver: overlay
    attachable: true