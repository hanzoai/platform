version: '3.8'

services:
  hanzo-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev-mount
    container_name: hanzo-platform
    restart: always
    networks:
      - hanzo-network
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://hanzo:amukds4wi9001583845717ad2@hanzo-postgres:5432/hanzo
      - REDIS_URL=redis://hanzo-redis:6379
      - IS_CLOUD=false
      - PORT=3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
      - pnpm-store:/root/.local/share/pnpm/store
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hanzo-platform.rule=Host(`platform.hanzo.ai`)"
      - "traefik.http.routers.hanzo-platform.entrypoints=websecure"
      - "traefik.http.routers.hanzo-platform.tls=true"
      - "traefik.http.routers.hanzo-platform.tls.certresolver=letsencrypt"
      - "traefik.http.services.hanzo-platform.loadbalancer.server.port=3000"
      - "traefik.docker.network=hanzo-network"

networks:
  hanzo-network:
    external: true

volumes:
  pnpm-store: