services:
  # Hanzo Platform Application
  platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev-mount
    container_name: hanzo-platform
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://hanzo:amukds4wi9001583845717ad2@hanzo-postgres:5432/hanzo
      REDIS_URL: redis://hanzo-redis:6379
      IS_CLOUD: "false"
      PORT: "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
      - pnpm-store:/root/.local/share/pnpm/store
    networks:
      - hanzo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hanzo-platform-http.rule=Host(`platform.hanzo.ai`)"
      - "traefik.http.routers.hanzo-platform-http.entrypoints=web"
      - "traefik.http.routers.hanzo-platform-https.rule=Host(`platform.hanzo.ai`)"
      - "traefik.http.routers.hanzo-platform-https.entrypoints=websecure"
      - "traefik.http.routers.hanzo-platform-https.tls=true"
      - "traefik.http.routers.hanzo-platform-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.hanzo-platform.loadbalancer.server.port=3000"
      - "traefik.docker.network=hanzo-network"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanzo
      POSTGRES_PASSWORD: hanzo123
      POSTGRES_DB: hanzo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hanzo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - hanzo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: hanzo-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@hanzo.ai"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - hanzo-network

networks:
  hanzo-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  hanzo_data:
  traefik_certs:
  pnpm-store: